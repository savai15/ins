<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160">
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#3fb950;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#3fb950">
        <animate attributeName="stop-color" values="#3fb950;#58a6ff;#3fb950" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="typed">
      <rect x="120" y="86" height="28">
        <animate attributeName="width" from="0" to="480" dur="2.4s" begin="0.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .wordmark { font: bold 72px "DejaVu Sans Mono", ui-monospace, monospace; fill: url(#wordmark); }
    .tagline { font: 20px "DejaVu Sans Mono", ui-monospace, monospace; fill: #8b949e; }
    .version { font: 14px "DejaVu Sans Mono", ui-monospace, monospace; fill: #6e7681; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .cardin { animation: fadein .6s ease-out forwards; }
  </style>

  <rect class="card cardin" x="8" y="8" width="704" height="144" rx="16"/>
  <text class="version" x="680" y="34" text-anchor="end">v0.3.0</text>
  <text class="wordmark" x="360" y="92" text-anchor="middle">ins</text>
  <g clip-path="url(#typed)">
    <text class="tagline" x="120" y="124">&gt; one command to install anything on linux</text>
  </g>
  <rect x="606" y="104" width="12" height="21" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.5;0.58" dur="1.2s" begin="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
