<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 110" width="720" height="110">
  <defs>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950">
        <animate attributeName="stop-color" values="#3fb950;#58a6ff;#3fb950" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#3fb950;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <style>
    .l1 { opacity: 0.9; }
    .l2 { opacity: 0.35; }
    @keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .enter { animation: rise .9s ease-out forwards; }
  </style>

  <g class="enter">
    <g class="l1">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; -720,0" dur="16s" repeatCount="indefinite"/>
        <path fill="url(#f1)" d="M0,62 L0,110 L720,110 L720,62 C660,36 600,36 540,62 C480,88 420,88 360,62 C300,36 240,36 180,62 C120,88 60,88 0,62 Z"/>
        <path fill="url(#f1)" d="M720,62 L720,110 L1440,110 L1440,62 C1380,36 1320,36 1260,62 C1200,88 1140,88 1080,62 C1020,36 960,36 900,62 C840,88 780,88 720,62 Z"/>
      </g>
    </g>
    <g class="l2">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; -720,0" dur="24s" repeatCount="indefinite"/>
        <path fill="url(#f2)" d="M0,78 L0,110 L720,110 L720,78 C660,60 600,60 540,78 C480,96 420,96 360,78 C300,60 240,60 180,78 C120,96 60,96 0,78 Z"/>
        <path fill="url(#f2)" d="M720,78 L720,110 L1440,110 L1440,78 C1380,60 1320,60 1260,78 C1200,96 1140,96 1080,78 C1020,60 960,60 900,78 C840,96 780,96 720,78 Z"/>
      </g>
    </g>
  </g>
</svg>
